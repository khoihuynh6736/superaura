<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>[⏳️6 HOURS] Super Aura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: lobby = hero (equipped aura, difficulty, moves, play) / level card / shop grid / footer tools;
   battle = HUD / 3D ring / thumb pad. One committed dark look (night arena). Accent --c follows the equipped aura. */
*{box-sizing:border-box}
:root{
  --ink:#0d0c22; --panel:#17153a; --panel2:#211e4d; --line:#34306a;
  --text:#f3f1ff; --muted:#a5a2d4; --gold:#ffc83d; --bad:#ff7d98; --good:#46e6a6; --c:#ff6fae;
  --display:'Bangers','Impact','Arial Narrow',sans-serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px; overflow:hidden; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%),var(--ink)}
#app{height:100%;max-width:980px;margin:0 auto}
section{height:100%}
section[hidden]{display:none!important}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- Lobby ---------- */
#lobby{overflow-y:auto;overscroll-behavior:contain;display:grid;gap:18px;align-content:start;padding-bottom:28px;scrollbar-width:thin}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chip{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--c);padding:6px 10px;border-radius:99px}
.chip.adm{background:var(--gold);margin-left:6px}
h1{font:400 clamp(48px,14vw,88px)/.9 var(--display);letter-spacing:.02em;margin:10px 0 0;text-shadow:3px 4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.vn{margin:8px 0 0;font:600 13px var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.wallet{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:99px;flex:none;font-variant-numeric:tabular-nums}
.wallet b{font:400 22px/1 var(--display);letter-spacing:.03em;color:var(--gold)}
.wallet i{font-style:normal;color:var(--muted);font-size:12px}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#b27a00);box-shadow:0 0 8px #ffc83d88}
.orb{--s:64px;width:var(--s);height:var(--s);border-radius:50%;flex:none;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 28%),radial-gradient(circle,var(--c) 38%,color-mix(in srgb,var(--c) 35%,#000) 100%);box-shadow:0 0 26px -2px var(--c);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 38px 2px var(--c)}}
.hero{background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));border-radius:18px;padding:16px;display:grid;gap:14px;box-shadow:0 0 44px -14px var(--c)}
.hero-main{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .orb{--s:88px}
.lbl{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h2{font:400 38px/1 var(--display);margin:2px 0 0;letter-spacing:.03em;color:var(--c)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.moves{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.moves li{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;min-width:0}
.moves b{flex:none;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--c);color:var(--ink);display:grid;place-items:center;font:700 11px var(--body)}
.moves em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moves span{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.basic{margin:0;font-size:12px;color:var(--muted)}
.basic b{color:var(--text)}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.diff{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;color:var(--text);cursor:pointer;display:grid;gap:2px;min-width:0}
.diff strong{font:400 22px/1 var(--display);letter-spacing:.04em}
.diff span{font-size:12px;color:var(--muted)}
.diff.on{border-color:var(--c);box-shadow:0 0 22px -8px var(--c)}
.diff.on strong{color:var(--c)}
.stats{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.btn{font:700 14px/1.2 var(--body);border-radius:12px;padding:12px 16px;cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line)}
.btn:hover:not(:disabled){border-color:var(--c)}
.btn.primary{background:var(--c);color:var(--ink);border-color:transparent;font:400 28px/1 var(--display);letter-spacing:.06em;padding:14px 18px}
.btn.sm{font-size:12px;padding:8px 12px;border-radius:10px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{margin:0;color:var(--bad);font-size:13px}
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.lv-top{display:flex;align-items:center;gap:14px}
.lv-badge{flex:none;width:64px;height:64px;border-radius:16px;background:var(--c);color:var(--ink);display:grid;place-items:center;align-content:center;line-height:1}
.lv-badge small{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase}
.lv-badge b{font:400 34px/1 var(--display)}
.lv-info{flex:1;min-width:0;display:grid;gap:6px}
.xpbar{height:10px;border-radius:99px;background:#090818;border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--c);width:0}
.lv-info span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{font-size:13px;color:var(--muted)}
.pts b{color:var(--gold);font-variant-numeric:tabular-nums}
.stat-rows{display:grid;gap:8px}
.arow2{display:flex;gap:6px}
.stat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px}
.stat-row strong{font:400 22px/1 var(--display);letter-spacing:.04em}
.stat-row strong b{color:var(--c);margin-left:6px}
.stat-row span{display:block;font-size:12px;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h3{font:400 30px/1 var(--display);letter-spacing:.04em;margin:0}
.sec-h span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.card.on{border-color:var(--c);box-shadow:0 0 26px -8px var(--c)}
.card-h{display:flex;align-items:center;gap:10px}
.card h4{font:400 24px/1 var(--display);letter-spacing:.04em;margin:0;color:var(--c)}
.card .tag{font-size:12px;color:var(--muted);margin:0}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:12px}
.card li{display:flex;justify-content:space-between;gap:6px}
.card li span{color:var(--muted);font-variant-numeric:tabular-nums}
.price{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.price.gold{color:var(--gold)}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--c);color:var(--text);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Admin ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,5,20,.8);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--gold);border-radius:18px;width:min(100%,460px);max-height:100%;overflow-y:auto;padding:18px;display:grid;gap:12px;box-shadow:0 0 60px -12px var(--gold)}
.mbox h3{color:var(--gold)}
.mbox p{margin:0;color:var(--muted);font-size:13px}
.arow{display:flex;flex-wrap:wrap;gap:8px}
.arow .btn{flex:1 1 130px}
.field{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:14px}
.tog button{min-width:64px}
.tog button.on{background:var(--gold);color:var(--ink);border-color:transparent}
.trow{display:grid;gap:6px}
.tl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl label{font-size:13px;color:var(--muted)}
.field.num{width:130px;text-align:right;padding:8px 10px}
.rng{width:100%;accent-color:var(--c)}

/* ---------- Battle ---------- */
#battle{display:flex;flex-direction:column;gap:8px;min-height:0}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fh{min-width:0}
.fh .nm{font:700 12px var(--body);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.fh.e .nm{justify-content:flex-end}
.fh .nm i{width:8px;height:8px;border-radius:50%;background:var(--fc);flex:none;box-shadow:0 0 8px var(--fc)}
.bar{height:14px;border-radius:99px;background:#090818;border:1px solid var(--line);position:relative;overflow:hidden}
.bar.st{height:6px;margin-top:4px;border-radius:4px}
.bar .trail,.bar .fill{position:absolute;top:0;bottom:0;left:0;width:100%}
.fh.e .bar .trail,.fh.e .bar .fill{left:auto;right:0}
.bar .trail{background:rgba(255,255,255,.45);transition:width .7s .2s}
.bar .fill{background:var(--fc);transition:width .1s}
.bar.st .fill{background:var(--gold);transition:width .08s}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font:700 9px var(--body);color:#fff;mix-blend-mode:difference;font-variant-numeric:tabular-nums}
.mid{display:grid;justify-items:center;gap:0}
#timer{font:400 32px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.quit{background:none;border:0;color:var(--muted);font:600 11px var(--body);cursor:pointer;padding:2px 6px;text-decoration:underline}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:14px;background:#0b0a1d;border:1px solid var(--line);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;font:400 26px/1 var(--display);letter-spacing:.04em;color:#fff;white-space:nowrap;text-shadow:0 2px 0 rgba(8,7,24,.9),0 0 10px rgba(8,7,24,.8);will-change:transform}
.pop.blk{color:#9fb4ff}.pop.cnt{color:var(--gold);font-size:30px}.pop.dg{color:#5ad1ff}.pop.brk{color:var(--bad);font-size:30px}.pop.hl{color:var(--good)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 14px rgba(255,60,90,.75)}
#flash.on{animation:fl .32s ease-out}
@keyframes fl{from{opacity:1}to{opacity:0}}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:400 clamp(56px,16vw,120px)/1 var(--display);letter-spacing:.04em;color:#fff;text-align:center;text-shadow:0 6px 0 var(--c),0 0 36px var(--c);opacity:0}
#banner.show{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
#result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,7,24,.74);backdrop-filter:blur(3px);padding:16px}
.rbox{background:var(--panel);border:1px solid var(--c);border-radius:18px;padding:20px;display:grid;gap:10px;text-align:center;width:min(100%,340px);box-shadow:0 0 50px -10px var(--c)}
.rbox h2{font:400 clamp(38px,10vw,52px)/1 var(--display);letter-spacing:.04em;margin:0}
.rbox p{margin:0;color:var(--muted);font-size:14px}
.rbox p b{color:var(--gold);font-variant-numeric:tabular-nums}
.rbox .up{color:var(--good);font-weight:700}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.rbtns .btn.primary{font-size:22px;padding:12px 10px}
.pad{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-block:2px}
#joy{display:none;width:112px;height:112px;flex:none;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid var(--line);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--c);opacity:.85;box-shadow:0 0 18px var(--c);pointer-events:none}
.skills{display:grid;gap:6px;flex:1;min-width:0;justify-items:end}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.sk{position:relative;width:52px;height:52px;border-radius:12px;border:2px solid var(--c);background:var(--panel);color:var(--text);font:600 9.5px/1.1 var(--body);padding:3px;display:grid;place-items:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;cursor:pointer}
.sk.act{border-color:var(--line)}
.sk .k{position:absolute;top:2px;left:5px;font:700 9px var(--body);color:var(--c)}
.sk .nm2{margin-top:7px;pointer-events:none}
.sk .cdv{position:absolute;inset:0;background:rgba(5,4,18,.74);transform-origin:bottom;transform:scaleY(0);pointer-events:none}
.sk.low{opacity:.45}
.sk.hold{background:var(--panel2);box-shadow:0 0 16px var(--c)}
.sk:active{transform:scale(.95)}
.hint{display:none;margin:0;text-align:center;color:var(--muted);font-size:12px}
@media (pointer:coarse){#joy{display:block}}
@media (pointer:fine){.skills{justify-items:center}.row{justify-content:center}.hint{display:block}.sk{width:86px;height:62px;font-size:11px}.sk .nm2{margin-top:9px}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}#banner.show{animation:none;opacity:1}#flash.on{animation:none}.toast{transition:none}}

/* ---------- Event / gear / wheel ---------- */
.evt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.evt .ev{min-width:0;flex:1 1 220px}
.evt strong{font:400 24px/1 var(--display);letter-spacing:.04em}
.evt span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.evt.moon{background:linear-gradient(100deg,#3a0610,#17153a 80%);border-color:#ff3b5c;box-shadow:0 0 34px -10px #ff3b5c}
.evt.moon strong{color:#ff6b84}
.btn.ready{background:var(--gold);color:var(--ink);border-color:transparent}
.gear{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.mats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mats b{color:var(--text);font-variant-numeric:tabular-nums}
.slot{background:var(--panel2);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.slot-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.slot-h strong{font:400 20px/1 var(--display);letter-spacing:.04em}
.slot-h span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.achip{font:600 12px var(--body);border-radius:99px;padding:6px 10px;border:1px solid var(--tc);color:var(--tc);background:transparent;cursor:pointer}
.achip.on{background:var(--tc);color:var(--ink)}
.craft-tabs{display:flex;gap:6px;flex-wrap:wrap}
.craft-tabs .btn.on{background:var(--c);color:var(--ink);border-color:transparent}
.recipe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px}
.recipe strong{font:400 19px/1 var(--display);letter-spacing:.04em}
.recipe span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.wheelwrap{position:relative;width:250px;height:250px;margin:6px auto}
.ptr{position:absolute;left:50%;top:-8px;margin-left:-11px;border:11px solid transparent;border-top:20px solid var(--gold);z-index:2;filter:drop-shadow(0 2px 3px #000)}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 40px -8px var(--gold)}
.wheel span{position:absolute;left:50%;top:50%;width:84px;margin-left:-42px;margin-top:-16px;text-align:center;font:700 11px/1.15 var(--body);color:#fff;text-shadow:0 1px 2px #000}
.wheel-hub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.wres{text-align:center;font:400 26px/1.1 var(--display);color:var(--gold);min-height:30px}
.lvtop{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--muted)}
.lvtop b{font:400 24px/1 var(--display);letter-spacing:.04em;color:var(--c);white-space:nowrap}
.lvtop .xpbar{flex:1;min-width:40px}
.lvtop span{white-space:nowrap;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:sticky;top:0;z-index:5;background:var(--ink);padding:2px 0 6px}
.tabs button{font:400 16px/1 var(--display);letter-spacing:.04em;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--c);color:var(--ink);border-color:transparent}
.pane{display:grid;gap:14px;align-content:start}
.pane[hidden]{display:none}
.top h1{font-size:clamp(36px,10vw,56px);margin-top:6px}
.fr{display:grid;gap:10px}
.fr .acct{font-size:12px;color:var(--muted)}
.fr .acct b{color:var(--text)}
.fr label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.frow{display:flex;gap:8px}.frow .field{flex:1;min-width:0}
.onl{display:grid;gap:6px}
.onl .p{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:14px}
.onl .p span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frst{font-size:13px;color:var(--gold);min-height:18px}
.nrow{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) auto;gap:8px;align-items:center}
.nrow span{font-size:13px;color:var(--muted)}
.nrow .field,.nrow2 .field{padding:8px 10px;width:auto}
.nrow2{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:center}
.mini{font-size:12px;color:var(--muted);margin:0}
.made{font:700 12px var(--body);letter-spacing:.12em;color:var(--muted);text-align:center}
.boom{font:400 clamp(30px,9vw,44px)/1 var(--display);letter-spacing:.04em;color:var(--gold);margin:0;text-shadow:0 0 22px #ffc83daa,2px 3px 0 #7a4d00;animation:boom .9s cubic-bezier(.2,1.4,.4,1) both}

let EN_LIST=null;const trCache=new Map();
const NEED_TR=/[^\x00-\x7f]|\b[Xx]u\b|\b[Tt]hua\b/;
function trEN(s){
  if(!NEED_TR.test(s))return s;
  const c=trCache.get(s);if(c!==undefined)return c;
  if(!EN_LIST)EN_LIST=[].concat(EN_X,EN_AURA,EN_MOVES,EN_BOTS,EN_UI).sort((a,b)=>b[0].length-a[0].length);
  let o=s;
  for(const [re,rp] of EN_RE.slice(0,2))o=o.replace(re,rp);
  for(const [a,b] of EN_LIST)if(o.includes(a))o=o.split(a).join(b);
  for(const [re,rp] of EN_RE.slice(2))o=o.replace(re,rp);
  if(trCache.size>3000)trCache.clear();
  trCache.set(s,o);return o;
}
const TR_ATTR=['placeholder','aria-label','title'];
function trNode(n){
  if(n.nodeType===3){const v=n.nodeValue,o=trEN(v);if(o!==v)n.nodeValue=o;}
  else if(n.nodeType===1){
    const tg=n.tagName;if(tg==='SCRIPT'||tg==='STYLE')return;
    for(const a of TR_ATTR){const v=n.getAttribute(a);if(v){const o=trEN(v);if(o!==v)n.setAttribute(a,o);}}
    for(let c=n.firstChild;c;c=c.nextSibling)trNode(c);
  }
}
function installEN(){
  document.documentElement.lang='en';
  const mo=new MutationObserver(recs=>{
    for(const r of recs){
      if(r.type==='characterData')trNode(r.target);
      else if(r.type==='attributes')trNode(r.target);
      else r.addedNodes.forEach(trNode);
    }
  });
  mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
  trNode(document.body);
}

function hwRoll(){

function hwPlay(n){

  while(sum.t<n&&save.hw.turns>0){
    save.hw.turns--;sum.t++;const p=hwRoll();
    if(p.trick){sum.trick++;sum.c+=1;save.hw.candy+=1;}
    else if(p.c){sum.c+=p.c;save.hw.candy+=p.c;if(p.big)sum.big++;}
    else if(p.coins){sum.coins+=p.coins;save.coins+=p.coins;}
    else if(p.iron){sum.iron+=p.iron;save.mats.iron+=p.iron;}
    else if(p.gem){sum.gem+=p.gem;save.mats.gem+=p.gem;}
    
    if(sum.t===1)sum.one=p;
  }
  if(!sum.t)return;
  if(sum.t===1){
    const p=sum.one;
    hwMsg=p.trick?HW_TRICKS[Math.random()*HW_TRICKS.length|0]:(p.big?'Kẹo khổng lồ! ':'')+'Được '+(p.c?p.c+' kẹo':p.coins?p.coins+' xu':p.iron?p.iron+' sắt vụn':p.gem?p.gem+' ngọc':'');
  }else{
    hwMsg='Đã chơi '+sum.t+' lượt · Được '+sum.c+' kẹo'+(sum.coins?' · Được '+sum.coins+' xu':'')+(sum.iron?' · Được '+sum.iron+' sắt vụn':'')+(sum.gem?' · Được '+sum.gem+' ngọc':'')+'';

}

function doSpin(){

  else if(act==='cancelchal'){cancelChal();}

  else if(act==='shoptab'){if(id==='aura'||id==='cos'||id==='mk'){shopTab=id;renderLobby();}}
  else if(act==='evview'){evView=id||'';renderQuests();const ob=$('.ovb');if(ob)ob.scrollTop=0;}

  else if(act==='login'||act==='signup'){openAcct(act,'');}

  else if(act==='equip'){save.equipped=id;persist();renderLobby();toast('Đã trang bị '+AURA[id].name);}
  else if(act==='buy'){
    const a=AURA[id];
    if(!a||a.ev||!released(a)||save.coins<dp(a.price)||save.owned.includes(id))return;
    save.coins-=dp(a.price);save.owned.push(id);save.equipped=id;persist();renderLobby();toast('Đã mua '+a.name+'!');
  }else if(act==='stat'){if(save.pts>0&&save.st[id]!==undefined){const k=Math.max(1,Math.min(Math.floor(+statQ)||1,save.pts));save.pts-=k;save.st[id]+=k;persist();renderLobby();}}

const hexs=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbk(pw,saltHex){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hexs(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(saltHex),iterations:150000},k,256));
}

async function acctSubmit(kind){
  const u=String(($('#acU')||{}).value||'').trim().toLowerCase(),pw=String(($('#acP')||{}).value||'');
  const say=t=>{const n=$('#accMsg');if(n)n.textContent=t;};
  if(Date.now()<acctLock){say('Thử sai nhiều lần. Hãy đợi '+Math.ceil((acctLock-Date.now())/1000)+' giây.');return;}
  if(!/^[a-z0-9_]{3,20}$/.test(u)){say('Tên tài khoản gồm 3-20 ký tự: chữ thường, số hoặc dấu gạch dưới.');return;}
  if(pw.length<6||pw.length>64){say('Mật khẩu phải từ 6 đến 64 ký tự.');return;}
  if(kind==='signup'&&pw!==String(($('#acP2')||{}).value||'')){say('Hai mật khẩu chưa giống nhau.');return;}
  say('Đang xử lý...');
  try{
    const reg=regGet();let d=null,x=reg[u]||null;
    if(dbCap){try{d=dbCap.collection('acct').doc(u);if(!x||kind==='signup'){const sn=await d.get();if(sn.exists)x=sn.data();}}catch(e){d=null;}}
    if(kind==='signup'){
      if(x){say('Tên tài khoản đã có người dùng.');return;}
      const salt=hexs(crypto.getRandomValues(new Uint8Array(16))),h=await pbk(pw,salt);
      reg[u]={salt,h};regSet(reg);
      syncFail='';if(d){try{await d.set({salt,h,nm:u,ts:Date.now()});}catch(e){d=null;syncFail=String(e&&e.message||e);}}
      await acctFinish(u,h,true);
      if(!d){accEl.hidden=true;toast('Đã tạo tài khoản, nhưng chưa lưu lên máy chủ: '+syncWhy()+'. Thiết bị khác chưa đăng nhập được.');return;}
    }else{
      if(!x){acctFails++;say(dbCap?'Không có tài khoản này.':'Không có tài khoản này trên thiết bị. Chưa kết nối được máy chủ để tìm tài khoản đã tạo ở thiết bị khác ('+syncWhy()+').');return;}
      const h=await pbk(pw,x.salt);
      if(h!==x.h){acctFails++;if(acctFails>=5){acctLock=Date.now()+30000;acctFails=0;}say('Sai mật khẩu.');return;}
      acctFails=0;reg[u]={salt:x.salt,h};regSet(reg);await acctFinish(u,h,false);
    }
    accEl.hidden=true;toast('Xin chào, '+u);
  }catch(e){say('Lỗi: '+(e&&e.message||e));}
}

  const t=r.log?(Math.log(x)-Math.log(r.min))/(Math.log(r.max)-Math.log(r.min)):(x-r.min)/(r.max-r.min);
  return Math.round(t*1000);
}

let AC=null,master=null,noiseBuf=null;
function audioInit(){
  if(AC){if(AC.state==='suspended'&&AC.resume)AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    master=AC.createGain();master.gain.value=save.set.vol/100;master.connect(AC.destination);
  }catch(e){AC=null;}
}
function noise(t0,dur,type,f0,f1,vol,q){
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);if(q)f.Q.value=q;

  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+.05);

function tone(t0,dur,type,f0,f1,vol){
  const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
}
let sfxLast={};
function sfx(k,v){
  if(!AC||!save.sound)return;
  const t=AC.currentTime;v=v||1;
  if(sfxLast[k]&&t-sfxLast[k]<.04)return;sfxLast[k]=t;
  switch(k){
    case 'jab':noise(t,.12,'bandpass',500,1600,.13,1.2);break;
    case 'hook':noise(t,.18,'bandpass',350,1500,.18,1);break;
    case 'dodge':noise(t,.2,'bandpass',1800,300,.14,1);break;
    case 'hit':noise(t,.14,'lowpass',1400,180,.5*v);tone(t,.16,'sine',140,45,.6*v);break;
    case 'block':noise(t,.08,'highpass',2400,900,.3);tone(t,.07,'square',260,110,.1);break;
    case 'cast':tone(t,.22,'sine',280,900,.1);noise(t,.2,'bandpass',600,2200,.1,1);break;
    case 'fire':noise(t,.5,'bandpass',1100,260,.34,.8);noise(t,.3,'highpass',3000,1200,.08);break;
    case 'ice':tone(t,.28,'triangle',2300,3300,.09);noise(t,.22,'highpass',4200,2400,.16);break;
    case 'zap':tone(t,.18,'sawtooth',1900,110,.16);noise(t,.22,'highpass',3200,900,.38);break;
    case 'boom':noise(t,.7,'lowpass',700,60,.85);tone(t,.5,'sine',75,28,.85);break;
    case 'tp':noise(t,.28,'bandpass',2400,200,.22,1);tone(t,.2,'sine',900,200,.1);break;
    case 'heal':[523,659,784].forEach((f,i)=>tone(t+i*.09,.35,'sine',f,f*1.004,.12));break;
    case 'shield':tone(t,.32,'triangle',380,820,.14);break;
    case 'rage':tone(t,.5,'sawtooth',90,40,.25);noise(t,.4,'lowpass',500,100,.4);break;
    case 'bell':tone(t,1,'triangle',880,870,.35*v);tone(t,.8,'sine',1760,1750,.12*v);break;
    case 'ko':noise(t,.9,'lowpass',900,50,.9);tone(t,.9,'sine',60,26,.9);noise(t+.1,1.2,'bandpass',900,700,.18,.5);break;

/* ---------- Update ---------- */
function readInput(p){
  let fx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);
  let fz=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
  fx+=joy.x;fz-=joy.y;
  const l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l;}
  p.in.fx=fx;p.in.fz=fz;
}
function stepFighter(f,dt){
  const o=other(f);
  f.hitStun=Math.max(0,f.hitStun-dt);f.dodgeT=Math.max(0,f.dodgeT-dt);f.dodgeCd=Math.max(0,f.dodgeCd-dt);
  f.regenDelay=Math.max(0,f.regenDelay-dt);f.recoil*=Math.exp(-7*dt);f.flash=Math.max(0,f.flash-dt);
  f.slow=Math.max(0,f.slow-dt);f.shield=Math.max(0,f.shield-dt);f.haste=Math.max(0,f.haste-dt);f.rage=Math.max(0,f.rage-dt);f.ghost=Math.max(0,f.ghost-dt);f.castT=Math.max(0,f.castT-dt);
  for(let i=0;i<f.cd.length;i++)f.cd[i]=Math.max(0,f.cd[i]-dt);
  if(admNoCost(f)){f.stam=100;for(let i=0;i<f.cd.length;i++)f.cd[i]=0;}
  if(f.down){f.downK=Math.min(1,f.downK+dt*1.6);f.kx*=Math.pow(.02,dt);f.kz*=Math.pow(.02,dt);f.x+=f.kx*dt;f.z+=f.kz*dt;f.spd=0;return;}
  if(f.burn>0){
    f.burn-=dt;
    if(!isGod(f))f.hp-=3*(f.burnMul||1)*dt;
    emit(f.x+rnd(.25),.4+Math.random()*1.4,f.z+rnd(.25),rnd(.2),1,rnd(.2),'#ff8a3d',.5,.4,'flame');
    if(Math.random()<.1)emit(f.x,1.8,f.z,0,.4,0,SMK.fire,1.2,.5,'smoke');
    if(f.hp<=0){f.hp=0;knockout(f,o);return;}
  }
  if(f.poison>0){
    f.poison-=dt;
    if(!isGod(f))f.hp-=3.5*(f.poisonMul||1)*dt;
    if(Math.random()<dt*16)emit(f.x+rnd(.25),.5+Math.random()*1.3,f.z+rnd(.25),0,.7,0,'#8fe82a',.7,.22,'glow');
    if(f.hp<=0){f.hp=0;knockout(f,o);return;}
  }
  stepFacing(f,o);
  if(f.punch){
    const P=f.punch,df=P.def;P.t+=dt;

    if(f.punch&&P.t>=df.wind+df.act+df.rec)f.punch=null;
  }
  const canMove=f.hitStun<=0&&f.dodgeT<=0&&!f.punch&&!f.dash&&G.state==='fight';
  let sp=canMove?(f.block?1.3:2.5):0;
  sp*=f.spdMul;if(f.slow>0)sp*=.55;if(f.haste>0)sp*=1.5;
  const rx=-f.fwz,rz=f.fwx;
  let vx=(f.fwx*f.in.fz+rx*f.in.fx)*sp,vz=(f.fwz*f.in.fz+rz*f.in.fx)*sp;
  if(f.dodgeT>0){const k=f.dodgeT/.3;vx+=f.dvx*k;vz+=f.dvz*k;}
  if(f.dash){
    const D=f.dash;D.t-=dt;vx+=D.vx;vz+=D.vz;
    if(!D.hit&&!o.down&&Math.hypot(o.x-f.x,o.z-f.z)<.85){D.hit=true;hurt(o,D.m.dmg,f,{kb:D.m.kb,dx:D.vx,dz:D.vz});}
    emit(f.x,.9,f.z,0,0,0,f.aura.color,.35,.9,'glow');
    if(grp(f.aura.el)==='elec')bolt(D.ox,1,D.oz,f.x,1,f.z,f.aura.color,.8,.09);
    if(D.t<=0)f.dash=null;
  }
  vx+=f.kx;vz+=f.kz;f.kx*=Math.pow(.02,dt);f.kz*=Math.pow(.02,dt);
  f.spd=Math.min(1,Math.hypot(vx,vz)/2.5);
  f.x=Math.max(-ARENA,Math.min(ARENA,f.x+vx*dt));f.z=Math.max(-ARENA,Math.min(ARENA,f.z+vz*dt));
  if(f.slow>0&&Math.random()<dt*14)emit(f.x+rnd(.3),.4+Math.random(),f.z+rnd(.3),0,.2,0,'#8fe3ff',.6,.35,'glow');
  if(!f.punch&&f.regenDelay<=0)f.stam=Math.min(100,f.stam+(f.block?7:22)*f.regMul*dt);

}
function updateProjs(dt){

function fireStrike(s){

function updateStrikes(dt){

function update(dt){
  G.time+=dt;

  if(G.state==='intro'){
    G.t-=dt;

  }else if(G.state==='fight'){

    readInput(p);

    if(G.pvp){const ri=G.ri;b.in.fx=ri.fx;b.in.fz=ri.fz;b.block=!!ri.bl&&!b.punch&&!b.dash&&b.hitStun<=0&&b.dodgeT<=0&&b.stam>0;}
    else{botAI(b,p,dt);b.block=b.blockHold>0&&!b.punch&&!b.dash&&b.hitStun<=0&&b.dodgeT<=0&&b.stam>0;}
  }else{p.in.fx=p.in.fz=0;b.in.fx=b.in.fz=0;if(G.state!=='over'){p.block=false;b.block=false;}}

  const dx=b.x-p.x,dz=b.z-p.z,d=Math.hypot(dx,dz)||.01,mn=.85;

/* ---------- Pose ---------- */
function pose(f){
  const m=f.model,t=G.time,L=V.tL,R=V.tR;
  if(f.block&&!f.punch){L.copy(V.bL);R.copy(V.bR);}else{L.copy(V.gL);R.copy(V.gR);}
  const sway=Math.sin(t*5+f.phase)*.025;L.y+=sway;R.y-=sway;
  let lean=0,twist=0;
  if(f.punch){
    const P=f.punch,d=P.def,out=d.hand==='L'?L:R,guard=d.hand==='L'?V.gL:V.gR,tt=P.t;
    const sign=d.hand==='R'?1:-1,amt=P.key==='jab'?.2:.32;
    if(tt<d.wind){out.lerpVectors(guard,d.chv,ease(tt/d.wind));}
    else if(tt<d.wind+d.act){const u=(tt-d.wind)/d.act;out.lerpVectors(d.chv,d.fuv,u);lean=.18*u;twist=sign*amt*u;}
    else{const u=ease(Math.min(1,(tt-d.wind-d.act)/d.rec));out.lerpVectors(d.fuv,guard,u);lean=.18*(1-u);twist=sign*amt*(1-u);}
  }else if(f.castT>0){
    const k=Math.sin(Math.min(1,(.32-f.castT)/.32)*Math.PI);
    L.lerp(V.cL,k);R.lerp(V.cR,k);lean+=.12*k;
  }
  const rc=f.recoil;
  lean-=.45*rc;L.y-=.12*rc;R.y-=.12*rc;
  let roll=0;
  if(f.dash)lean+=.4;
  if(f.dodgeT>0){const k=f.dodgeT/.3;if(f.dodgeSide)roll=-f.dodgeSide*.4*k;else lean-=.3*k;}
  m.body.rotation.set(lean,twist,roll);
  m.body.position.y=Math.sin(t*5+f.phase)*.015+Math.abs(Math.sin(t*11+f.phase))*.03*f.spd;
  if(f.down){const k=ease(f.downK);m.body.rotation.set(-1.45*k,0,0);m.body.position.y=.22*k;}
  const sw2=Math.sin(t*11+f.phase)*.7*f.spd;
  m.legs[0].rotation.x=.12+sw2;m.legs[1].rotation.x=-.12-sw2;
  armTo(m.armL,V.sL,L,1);armTo(m.armR,V.sR,R,-1);
  m.root.position.set(f.x,0,f.z);
  m.root.rotation.y=Math.atan2(f.fwx,f.fwz);
  const pulse=1+Math.sin(t*4+f.phase)*.05+((f.haste>0||f.rage>0)?.12:0),boost=(f.haste>0||f.rage>0)?1.9:1;
  m.shell.scale.set(.78*pulse,1.3*pulse,.78*pulse);
  m.shell.material.uniforms.uTime.value=t;m.shell.material.uniforms.uInt.value=boost;
  m.shield.material.uniforms.uTime.value=t;
  m.ring.scale.setScalar(pulse);
  m.shield.visible=f.shield>0&&(f.shield>.6||Math.floor(t*10)%2===0);
  auraWisps(m,t,boost);
  const fk=Math.min(1,f.flash/.16);m.skin.emissive.setRGB(fk*.75,fk*.2,fk*.2);
  const gh=f.ghost>0;if(f._gh!==gh){f._gh=gh;m.mats.forEach(mt=>{mt.transparent=gh;mt.opacity=gh?.3:1;mt.needsUpdate=true;});}
}
function updateCamera(dt,snap){
  const p=G.p,b=G.b,rx=-p.fwz,rz=p.fwx,base=camera.aspect<1?72:55;
  const ko=G.state==='over'&&G.kind==='ko'&&G.koT<2.2;
  if(ko){

    V.camT.set(v.x+(w.x-v.x)*-.4+rx*1.2,1.5,v.z+(w.z-v.z)*-.4+rz*1.2);

  }else{

let fpsN=0,fpsT=0;

const r2=v=>Math.round(v*100)/100;
const cleanName=t=>String(t||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,20);
function myName(){return save.nick||cleanName(me.name)||(myName.d||(myName.d=(save.set.lang==='en'?'Fighter ':'Võ sĩ ')+(100+Math.random()*900|0)));}
const netSend=(topic,data)=>{if(net.rm)net.rm.emit(topic,data).catch(()=>{});};
const netEv=o=>netSend('ev',o);
function sendSt(){
  if(!G||!G.pvp)return;const p=G.p;
  netSend('st',{x:r2(p.x),z:r2(p.z),hp:Math.round(p.hp),mx:Math.round(p.maxHp),s:Math.round(p.stam),fx:r2(p.in.fx),fz:r2(p.in.fz),bl:p.block?1:0});
}
function setPresence(){if(room)room.presence({nm:myName(),st:net.state==='fight'||net.state==='conn'?'fight':'lobby',au:save.equipped,cs:save.cos}).catch(()=>{});}
function renderAcct(){
  const el=$('#acct');if(!el)return;
  if(!room)el.innerHTML='Đấu người chơi cần kết nối máy chủ. Hiện chưa kết nối được. <button class="btn sm" type="button" data-act="retry">Thử lại</button>';
  else el.innerHTML=(acct?'Tài khoản: <b>'+esc(acct.u)+'</b>. ':'')+'Đã kết nối. Người chơi đang ở sảnh sẽ hiện ở bên dưới và ở trang chủ.';
}
function renderOnline(){
  const el=$('#onl');if(!el)return;
  const list=lobbyPeers.filter(p=>p.presence.st==='lobby');
  el.innerHTML=list.length?list.map(p=>`<div class="p"><span>${esc(cleanName(p.presence.nm))}</span><button class="btn sm" type="button" data-act="chalp" data-p="${esc(p.peer)}">Thách đấu</button></div>`).join(''):'<p class="mini">Chưa thấy ai khác đang ở sảnh.</p>';
}
function setFrSt(t){net.msg=t||'';renderFrSt();}
function renderFrSt(){
  const el=$('#frst');if(!el)return;
  el.innerHTML=esc(net.msg||'')+(net.state==='wait'?' <button class="btn sm" type="button" data-act="cancelchal">Hủy</button>':'');
}
function onPeers(ch){
  const mine=ch.peers.find(p=>p.isMe&&p.sameTab);if(mine)myPeer=mine.peer;
  lobbyPeers=ch.peers.filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&typeof p.presence.nm==='string'&&p.presence.nm);
  renderOnline();renderHome(AURA[save.equipped]);renderPlaza();
}
function challengeByName(){
  const inp=$('#fname');const q=cleanName(inp&&inp.value).toLowerCase();
  if(!q){toast('Nhập tên người chơi trước.');return;}
  const list=lobbyPeers.filter(p=>p.presence.st==='lobby');
  const hit=list.find(p=>cleanName(p.presence.nm).toLowerCase()===q);
  if(!hit){setFrSt('Không thấy "'+cleanName(inp.value)+'" đang ở sảnh. Người chơi cần mở trang này (đã được mời) và chọn Đấu Người chơi.');return;}
  challengePeer(hit.peer);
}
function challengePeer(peer){
  if(!room||!battle.hidden)return;
  if(net.state!=='idle'){toast('Đang bận.');return;}
  const t=lobbyPeers.find(p=>p.peer===peer);if(!t)return;
  const id='m'+Math.random().toString(36).slice(2,10);
  net.state='wait';net.pend={peer,room:id,nm:cleanName(t.presence.nm)};
  room.emit('chal',{to:peer,nm:myName(),room:id}).catch(()=>{});
  setFrSt('Đã gửi lời thách đấu tới '+net.pend.nm+', đang chờ…');
  clearTimeout(net.tmO);net.tmO=setTimeout(()=>{if(net.state==='wait'){net.state='idle';net.pend=null;setFrSt('Hết thời gian chờ, người chơi chưa trả lời.');}},25000);
}
function cancelChal(){if(net.state==='wait'){net.state='idle';net.pend=null;clearTimeout(net.tmO);setFrSt('Đã hủy.');}}
function renderChal(){
  const bx=$('#chalBox');
  if(!net.inv){$('#chalm').hidden=true;return;}
  bx.innerHTML=`<h3>Lời thách đấu</h3><p><b style="color:var(--text)">${esc(net.inv.nm)}</b> muốn đấu với bạn.</p><div class="arow"><button class="btn primary" type="button" data-ch="yes">Chấp nhận</button><button class="btn" type="button" data-ch="no">Từ chối</button></div>`;
  $('#chalm').hidden=false;
}
$('#chalm').addEventListener('click',e=>{
  const b=e.target.closest('[data-ch]');if(!b||!net.inv)return;
  const inv=net.inv;net.inv=null;clearTimeout(net.tmO);$('#chalm').hidden=true;
  if(b.dataset.ch==='yes'&&net.state==='inv'){room.emit('acc',{to:inv.peer,room:inv.room}).catch(()=>{});enterMatchRoom(inv.room,inv.peer);}
  else{room.emit('dec',{to:inv.peer}).catch(()=>{});net.state='idle';}
});
function netReset(){
  clearInterval(net.helloT);clearTimeout(net.tmO);
  net.unsub.forEach(f=>{try{f();}catch(e){}});net.unsub=[];
  if(net.rm){try{net.rm.leave();}catch(e){}}
  net.rm=null;net.state='idle';net.pend=null;net.inv=null;net.oppPeer='';net.opp=null;net.got=false;
  setPresence();
}
function netLeave(){
  if(net.rm&&net.state==='fight')netSend('bye',{});
  if(net.rm||net.state==='conn'||net.state==='fight')netReset();
}
function netFail(t){netReset();setFrSt(t);if(!lobby.hidden)renderLobby();toast(t);}
async function enterMatchRoom(name,oppPeer){
  net.state='conn';net.oppPeer=oppPeer;net.got=false;net.opp=null;setPresence();
  let rm;
  try{rm=await room.join(name);}catch(e){netFail('Không vào được phòng đấu.');return;}
  net.rm=rm;
  const fromOpp=m=>!m.isMe&&m.peer===net.oppPeer;
  net.unsub.push(rm.on('hello',m=>{
    if(!fromOpp(m)||!m.data)return;
    const d=m.data,num=(v,lo,hi,df)=>{v=+v;return isFinite(v)?Math.min(hi,Math.max(lo,v)):df;};
    if(net.got)return;
    net.got=true;
    net.opp={aura:AURA[d.aura]?d.aura:'rubber',hp:num(d.hp,1,1e7,100),dmg:num(d.dmg,.01,1e5,1),spd:num(d.spd,.1,10,1),reg:num(d.reg,.1,10,1),cos:COSM[d.cos]?d.cos:'c0',eq:cleanEq(d.eq),nm:cleanName(d.nm)||'Người chơi'};
    sendHello();clearInterval(net.helloT);
    net.state='fight';setPresence();startMatch(false,true);
  }));
  net.unsub.push(rm.on('st',m=>{
    if(!fromOpp(m)||!m.data||!G||!G.pvp||G.state==='over')return;
    const d=m.data,b=G.b,ok=v=>typeof v==='number'&&isFinite(v);
    if(ok(d.x)&&ok(d.z)&&!b.down){
      const bx=-Math.max(-ARENA,Math.min(ARENA,d.x)),bz=-Math.max(-ARENA,Math.min(ARENA,d.z));
      if(Math.hypot(bx-b.x,bz-b.z)>1.2){b.x=bx;b.z=bz;}else{b.x+=(bx-b.x)*.35;b.z+=(bz-b.z)*.35;}
    }
    if(ok(d.mx)&&d.mx>0&&d.mx<=1e8)b.maxHp=d.mx;
    if(ok(d.hp)&&!b.down)b.hp=Math.max(0,Math.min(b.maxHp,d.hp));
    if(ok(d.s))b.stam=Math.max(0,Math.min(100,d.s));
    G.ri.fx=ok(d.fx)?Math.max(-1,Math.min(1,d.fx)):0;G.ri.fz=ok(d.fz)?Math.max(-1,Math.min(1,d.fz)):0;G.ri.bl=d.bl?1:0;
  }));
  net.unsub.push(rm.on('ev',m=>{
    if(!fromOpp(m)||!m.data||!G||!G.pvp||G.state!=='fight')return;
    const d=m.data,b=G.b;
    if(d.k==='jab'||d.k==='hook')tryPunch(b,d.k);
    else if(d.k==='dodge')tryDodge(b,+d.sx||0);
    else if(d.k==='c'&&Number.isInteger(d.i)&&d.i>=0&&d.i<b.aura.moves.length){b.cd[d.i]=0;castSkill(b,d.i);}
  }));
  net.unsub.push(rm.on('ko',m=>{
    if(!fromOpp(m)||!G||!G.pvp||G.state==='over')return;
    G.rko=true;G.b.hp=0;knockout(G.b,G.p);G.rko=false;
  }));
  net.unsub.push(rm.on('bye',m=>{if(fromOpp(m))oppLeft();}));
  net.unsub.push(rm.onPeers(ch=>{if(net.oppPeer&&ch.left.some(p=>p.peer===net.oppPeer))oppLeft();}));
  const t0=Date.now();
  sendHello();
  net.helloT=setInterval(()=>{
    if(net.got){clearInterval(net.helloT);return;}
    if(Date.now()-t0>15000){netFail('Đối thủ không phản hồi.');return;}
    sendHello();
  },600);
}
function sendHello(){
  if(!net.rm)return;const ps=pStat();
  net.rm.emit('hello',{cos:save.cos,eq:save.eq,aura:save.equipped,hp:ps.maxHp,dmg:ps.dmg,spd:ps.spd,reg:ps.reg,nm:myName()}).catch(()=>{});
}
function oppLeft(){
  if(G&&G.pvp&&G.state!=='over'&&!battle.hidden){endMatch('win','pts','ĐỐI THỦ THOÁT');}
}
async function cloudLoad(){
  try{
    cloudDoc=acct?dbCap.collection('acctsave').doc(acct.u):dbCap.collection('data/users/'+me.id).doc('save');
    const snap=await cloudDoc.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&typeof d.json==='string'&&+d.ts>(save.ts||0)){
        let o=null;try{o=JSON.parse(d.json);}catch(e){}
        if(o){save=normSave(o);save.ts=+d.ts;try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}if(!lobby.hidden)renderLobby();}
      }else if(+d.ts<(save.ts||0))cloudPush();
    }else if(save.ts)cloudPush();
  }catch(e){cloudDoc=null;}
  renderAcct();
}
let connErr='',handlersOn=false,booting=false;
async function boot(){
  if(booting)return;booting=true;connErr='';
  try{
    if(typeof claude==='undefined'||!claude||!claude.use){connErr='Trang này không chạy bên trong Claude. Hãy mở game bằng link artifact trên claude.ai (đã đăng nhập).';return;}
    const errs=[];
    try{if(!userCap)userCap=await claude.use('user');if(userCap)me=await userCap.me();}catch(e){errs.push('tài khoản: '+(e&&e.message||e));}
    try{if(!dbCap)dbCap=await claude.use('db');}catch(e){errs.push('lưu trữ: '+(e&&e.message||e));}
    try{if(!room)room=await claude.use('room');}catch(e){errs.push('phòng đấu: '+(e&&e.message||e));}
    if(errs.length)connErr='Lỗi kết nối ('+errs.join('; ')+'). Bạn cần mở link bằng tài khoản đã được chủ trang mời (Contributor trở lên).';
    else if(!(me&&me.id))connErr='Chưa nhận được tài khoản Claude. Hãy đăng nhập Claude rồi mở lại link game.';
    renderAcctBar();
  if(room&&!handlersOn){handlersOn=true;
    room.onPeers(onPeers);
    room.on('chal',m=>{
      const d=m.data;if(m.isMe||!d||d.to!==myPeer)return;
      if(net.state!=='idle'||!battle.hidden||!/^m[a-z0-9]{1,12}$/.test(String(d.room))){room.emit('dec',{to:m.peer}).catch(()=>{});return;}
      net.state='inv';net.inv={peer:m.peer,nm:cleanName(d.nm)||'Người chơi',room:String(d.room)};
      clearTimeout(net.tmO);net.tmO=setTimeout(()=>{if(net.state==='inv'){net.state='idle';net.inv=null;renderChal();}},25000);
      renderChal();
    });
    room.on('acc',m=>{
      const d=m.data;if(m.isMe||!d||d.to!==myPeer||net.state!=='wait'||!net.pend||m.peer!==net.pend.peer||d.room!==net.pend.room)return;
      clearTimeout(net.tmO);const p=net.pend;net.pend=null;enterMatchRoom(p.room,p.peer);
    });
    room.on('dec',m=>{
      const d=m.data;if(m.isMe||!d||d.to!==myPeer||net.state!=='wait'||!net.pend||m.peer!==net.pend.peer)return;
      clearTimeout(net.tmO);net.state='idle';net.pend=null;setFrSt('Người chơi đã từ chối hoặc đang bận.');
    });
    setPresence();
  }
    if(room)setPresence();
    if(dbCap&&acct){try{const sn=await dbCap.collection('acct').doc(acct.u).get();if(sn.exists&&sn.data().h!==acct.h){acctClear();connErr='';}}catch(e){}}
    if(dbCap&&(acct||(me&&me.id)))await cloudLoad();else if(acct)cloudDoc=null;
    if(!lobby.hidden)renderLobby();
  }finally{booting=false;renderAcctBar();renderAcct();}
}
runLoading();
boot();
setTimeout(()=>{try{if(dgFreeOn()&&!save.evs.dg.free)toast('Sự kiện The Dark Ghost: nhận 1 lượt quay aura miễn phí ở tab Sự kiện!');}catch(e){}},3800);

if(save.set.lang==='en')installEN();
applySettings();
renderLobby();
})();
</script>
